name: Monthly Mutual Fund Stock Holdings Dataset Update

on:
  schedule:
    # Runs on the 12th of every month at 21:00 UTC (post SEBI AMFI monthly disclosure deadline)
    - cron: '0 21 12 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Mutual Fund Holdings
        run: |
          python update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes in mutual fund holdings."
          else
            git commit -m "chore(data): automated monthly mutual fund holdings update [skip ci]"
            git push
          fi
